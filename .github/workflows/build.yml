name: Build Cravio Android App (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android Project Setup
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create . --org com.eevaan.cravio --project-name cravio
          cp /tmp/main.dart lib/main.dart

      - name: Build Release APK
        run: flutter build apk --release

      - name: Publish Cravio APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cravio-final-v4-${{ github.run_number }}
          name: Cravio Master 4-in-1 App
          files: build/app/outputs/flutter-apk/app-release.apk
